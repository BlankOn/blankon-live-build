# SDDM takes tty1, which Plymouth still holds in VT_PROCESS mode while the
# splash is up, and unlike GDM it has no Plymouth handoff of its own. Left
# alone, SDDM fails until Plymouth gives up, and the unit's StartLimitBurst
# can be exhausted before that happens. Quit Plymouth first so the display
# server gets the VT on the first try, live session and installed system alike.
[Unit]
After=plymouth-start.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
