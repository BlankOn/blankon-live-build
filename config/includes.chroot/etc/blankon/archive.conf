# Single source of truth for the BlankOn archive.
#
# This file is shipped verbatim into the live filesystem as
# /etc/blankon/archive.conf. On this branch one consumer reads it:
#
#   * build-iso, which rewrites the LB_*MIRROR* values in config/bootstrap
#     from it after every "lb config", so the ISO is built from this archive.
#
# The minimal image ships no installer, so nothing points an installed system
# at the archive; the copy in the live filesystem is there so anything run by
# hand in the live session can read the same values.
#
# To move between the development and production archives, change
# ARCHIVE_HOST here and rebuild. Nothing else needs editing.
#
#   development: arsip-dev.blankonlinux.id
#   production:  arsip.blankonlinux.id

ARCHIVE_HOST="arsip.blankonlinux.id"
ARCHIVE_SUITE="sinambung"
ARCHIVE_URI="http://${ARCHIVE_HOST}/${ARCHIVE_SUITE}/"
