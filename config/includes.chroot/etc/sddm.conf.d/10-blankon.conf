# Use Plasma's own Breeze greeter rather than the Debian-branded variant
# sddm recommends, so the login screen matches the session behind it.
#
# Autologin for the live user is not configured here: live-config(7)'s
# 0085-sddm component writes it to /etc/sddm.conf from the username= boot
# parameter, and that file takes precedence over sddm.conf.d.
[Theme]
Current=breeze
